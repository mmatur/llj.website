<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="400" height="320">
  <title>Les Longues Journées — Logo 2026</title>

  <!-- Van Gogh style swirling sky -->
  <g stroke-linecap="round" fill="none">
    <!-- Turquoise base swirl -->
    <path d="M 70 150 C 100 90, 165 70, 215 100 C 260 130, 300 115, 330 150"
          stroke="#2ca6c4" stroke-width="12"/>
    <!-- Orange-red accent -->
    <path d="M 100 140 C 130 97, 175 90, 215 115 C 245 135, 280 125, 305 145"
          stroke="#e74c3c" stroke-width="8"/>
    <!-- Yellow warmth -->
    <path d="M 120 170 C 155 145, 200 140, 245 160 C 270 173, 290 175, 300 175"
          stroke="#f4c430" stroke-width="9"/>
    <!-- Left curl -->
    <path d="M 125 125 C 142 110, 168 113, 175 133 C 180 147, 167 155, 153 148"
          stroke="#2ca6c4" stroke-width="6"/>
    <!-- Right curl -->
    <path d="M 250 113 C 268 103, 288 110, 290 127 C 291 141, 278 147, 265 140"
          stroke="#e74c3c" stroke-width="5.5"/>
  </g>

  <!-- Sun core -->
  <circle cx="200" cy="160" r="26" fill="#f4c430"/>
  <circle cx="200" cy="160" r="26" fill="none" stroke="#e74c3c" stroke-width="4"/>

  <!-- Hills (solid green) -->
  <path d="M 30 250 C 90 205, 145 225, 200 230 C 255 235, 305 207, 370 250 L 370 290 L 30 290 Z"
        fill="#7cb342"/>
  <!-- Darker green ground -->
  <path d="M 30 270 L 370 270 L 370 290 L 30 290 Z"
        fill="#5a9935"/>

  <!-- Stage -->
  <rect x="180" y="248" width="40" height="22" fill="#e74c3c"/>
  <path d="M 176 248 L 224 248 L 217 238 L 183 238 Z" fill="#e74c3c"/>

  <!-- Audience dots -->
  <g fill="#fdf9f2">
    <circle cx="115" cy="277" r="5"/>
    <circle cx="132" cy="279" r="5"/>
    <circle cx="150" cy="278" r="5"/>
    <circle cx="253" cy="278" r="5"/>
    <circle cx="270" cy="279" r="5"/>
    <circle cx="287" cy="277" r="5"/>
  </g>

  <!-- Tree -->
  <rect x="330" y="220" width="6" height="50" fill="#8b5a2b"/>
  <circle cx="333" cy="210" r="22" fill="#4a8c3f"/>
  <circle cx="333" cy="210" r="22" fill="none" stroke="#7cb342" stroke-width="2"/>
</svg>
